# Configuracion de Netlify para lokomproaqui (Angular 9) -- la app que tiene el dominio.
#
# COMO FUNCIONA EL SITIO: son DOS aplicaciones trabajando juntas.
#   - Esta (Angular) atiende el dominio y sirve la mayor parte del sitio.
#   - lokomproaqui-next (Next.js) atiende 14 rutas concretas (login, registro, info,
#     portal, config/perfil, config/productos, etc.).
# Esta app hace de portero: cuando llega una peticion a una de esas 14 rutas, se la pasa al
# Next.js por proxy, de forma invisible para el visitante (la URL sigue siendo
# lokomproaqui.com/login, no la del otro sitio). Es la migracion por fases que quedo a medias.
#
# IMPORTANTE -- por que Netlify y no Cloudflare Pages:
# Cloudflare Pages NO permite reescrituras hacia otro dominio, solo redirecciones visibles
# (verificado el 2026-09-02 al migrar Movi). Con Cloudflare, un visitante que entrara a
# lokomproaqui.com/login terminaria viendo la URL del otro sitio en la barra de direcciones.
# Netlify si soporta proxy real a un dominio externo con status 200, que es lo que estas
# reglas necesitan.
#
# AL CAMBIAR DE HOSTING: las 14 reglas de abajo apuntan a la URL del sitio Next.js. Si esa
# URL cambia, hay que actualizarlas TODAS o el login, el registro y el panel del proveedor
# dejan de funcionar aunque el resto del sitio se vea bien.

[build]
  command = "npm run build"
  publish = "dist/locomproAqui/browser"

[build.environment]
  # Angular 9 con webpack 4 no arranca en Node moderno sin este flag: usa APIs de OpenSSL
  # que Node 17+ retiro por defecto. Sin esto el build muere con
  # "error:0308010C:digital envelope routines::unsupported".
  NODE_OPTIONS = "--openssl-legacy-provider --max-old-space-size=6144"
  NODE_VERSION = "18"

# ─── Las 14 rutas que atiende el Next.js ────────────────────────────────────────
# status 200 = proxy invisible (el visitante no ve el cambio de sitio).
# force = true es necesario porque Netlify da prioridad a los archivos reales, y sin el
# la regla comodin del final se comeria estas rutas.

[[redirects]]
  from = "/mfe-ping"
  to = "https://lokomproaqui-next.netlify.app/mfe-ping"
  status = 200
  force = true

[[redirects]]
  from = "/tutoriales"
  to = "https://lokomproaqui-next.netlify.app/tutoriales"
  status = 200
  force = true

[[redirects]]
  from = "/infoSupplier"
  to = "https://lokomproaqui-next.netlify.app/infoSupplier"
  status = 200
  force = true

[[redirects]]
  from = "/portal"
  to = "https://lokomproaqui-next.netlify.app/portal"
  status = 200
  force = true

[[redirects]]
  from = "/testimonio"
  to = "https://lokomproaqui-next.netlify.app/testimonio"
  status = 200
  force = true

[[redirects]]
  from = "/info"
  to = "https://lokomproaqui-next.netlify.app/info"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "https://lokomproaqui-next.netlify.app/login"
  status = 200
  force = true

[[redirects]]
  from = "/singUp"
  to = "https://lokomproaqui-next.netlify.app/singUp"
  status = 200
  force = true

[[redirects]]
  from = "/singUp/*"
  to = "https://lokomproaqui-next.netlify.app/singUp/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/registro"
  to = "https://lokomproaqui-next.netlify.app/registro"
  status = 200
  force = true

[[redirects]]
  from = "/mvid8x2qz1"
  to = "https://lokomproaqui-next.netlify.app/mvid8x2qz1"
  status = 200
  force = true

[[redirects]]
  from = "/mvid8x2qz1/panel"
  to = "https://lokomproaqui-next.netlify.app/mvid8x2qz1/panel"
